aid: daqstra
name: Daqstra
description: >-
  Daqstra is an AI-native operating platform for complex test infrastructure,
  giving aerospace, energy, and robotics teams observability and orchestration
  for the physical world. The platform connects data-acquisition hardware
  (National Instruments, PLCs, and custom equipment) at the edge, centralizes
  and versions test data in the cloud, and orchestrates hardware sequences and
  test logic as code through Python and REST APIs. Daqstra Edge streams live
  signals from physical hardware, Daqstra Hub (Strata Hub) organizes
  test-campaign data with AI-powered insight, and the Daqstra API lets engineers
  drive test runs programmatically instead of through manual CSV workflows. The
  company was founded by aerospace-propulsion and avionics engineers and is
  backed by Y Combinator (S26 batch).
